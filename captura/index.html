<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141518">
<title>Captura de recorridos · Fire Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#141518; --panel:#1c1e22; --panel2:#24272c; --line:#33373e; --text:#e8e6e3; --mute:#9a9ea6;
  --fire:#ff6a2b; --fire2:#ffb23f; --ok:#4cc38a; --warn:#f2c94c; --bad:#ff5c5c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.25)}
button.pri{background:var(--fire);border-color:var(--fire);color:#160a04;font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.4}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.mute{color:var(--mute)}
.small{font-size:13px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .dot{width:10px;height:10px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 40%,var(--fire2),var(--fire));box-shadow:0 0 10px var(--fire)}
header button{padding:8px 11px}
main{padding:12px 12px 150px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.row .sp{flex:1}
.list .card{display:flex;align-items:center;gap:12px}
.list .card .tx{flex:1;min-width:0}
.list .card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover{width:64px;height:48px;border-radius:8px;object-fit:cover;background:var(--panel2);flex:none}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
/* estaciones */
.est{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.est.on{border-color:var(--fire);box-shadow:0 0 0 1px var(--fire) inset}
.est .hd{display:flex;align-items:center;gap:8px;padding:10px 12px}
.est .n{font-family:ui-monospace,monospace;font-weight:700;color:var(--fire2)}
.est .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.est .nm.sin{color:var(--mute);font-weight:400;font-style:italic}
.est .fx{padding:6px 9px;border-radius:9px}
.est .fx.on{background:var(--fire);border-color:var(--fire);color:#160a04}
.strip{display:flex;gap:6px;overflow-x:auto;padding:0 12px 12px}
.strip img{height:72px;width:auto;min-width:54px;border-radius:7px;background:var(--panel2);flex:none}
.strip .add{height:72px;min-width:72px;border-style:dashed;color:var(--mute);flex:none}
/* barra inferior */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(28,30,34,.96);border-top:1px solid var(--line);padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chip{flex:none;padding:7px 12px;border-radius:18px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--fire2);border-color:var(--fire2);color:#160a04;font-weight:600}
.dock .acts{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}
.dock .acts button{padding:13px 6px;font-weight:600}
.dock .acts .shot{font-size:17px}
.dock .lbl{font-size:12px;color:var(--mute);margin:0 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.sheet .stack{display:flex;flex-direction:column;gap:8px}
.sheet .stack button{text-align:left}
.viewer{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .bar{display:flex;gap:8px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--panel)}
.viewer .bar button{flex:1}
.toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:9px 14px;border-radius:10px;z-index:40;max-width:90vw;text-align:center;pointer-events:none;transition:opacity .3s}
.busy{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--fire);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cam{position:fixed;inset:0;z-index:35;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.cam .ctop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:12px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(#000a,#0000);font-weight:600}
.cam .ctop .cn{color:var(--fire2);font-family:ui-monospace,monospace}
.cam .czoom{position:absolute;left:0;right:0;bottom:118px;display:flex;justify-content:center;gap:8px}
.cam .czoom button{border-radius:20px;padding:7px 12px;background:#000a;border-color:#fff4;font-weight:600}
.cam .czoom button.on{background:var(--fire2);color:#160a04;border-color:var(--fire2)}
.cam .cbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px;padding-bottom:max(18px,env(safe-area-inset-bottom));background:#000}
.cam .cbar button{background:#1c1e22}
.cam .shut{width:74px;height:74px;border-radius:50%;background:#fff!important;border:5px solid var(--fire)!important;padding:0}
.cam .shut:active{transform:scale(.92)}
.cam .shut:disabled{opacity:.5}
.cam .cmsg{position:absolute;left:12px;right:12px;top:45%;text-align:center;color:var(--mute)}
.cam .cprev{position:absolute;left:14px;bottom:118px;width:58px;height:58px;border-radius:8px;object-fit:cover;border:2px solid #fff;display:none}
.help p{margin:6px 0}
.help ol{padding-left:20px;margin:6px 0}
a{color:var(--fire2)}
</style>
</head>
<body>
<header id="hd"></header>
<main id="main"></main>
<div id="dock" class="dock"></div>
<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inGal" accept="image/*" multiple hidden>

<script>
'use strict';
/* =========================================================
   Captura de recorridos — compañera del Planificador de recorridos.
   Edificio > recorridos > estaciones > fotos. Todo queda guardado en el
   teléfono (IndexedDB). Exporta un .zip que el planificador abre con
   Menú > Abrir proyecto (mismo formato que su propio .zip).
   ========================================================= */

const NOMBRES = ['Frontis','Lateral izquierdo','Lateral derecho','Posterior','Acceso','Hall','Pasillo',
  'Escalera','Patio','Piso 2','Piso 3','Techo','Entretecho','Subterráneo','Living','Cocina','Dormitorio',
  'Baño','Bodega','Estacionamiento','Ventana','Puerta','Foco'];
const TAMANOS = {1920:'1920 px (liviano)', 2560:'2560 px (recomendado)', 0:'Original'};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = (n, k = 3) => String(n).padStart(k, '0');
function slug(s){return (s||'foto').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'foto';}

/* ---------- almacenamiento ---------- */
let DB;
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('captura-recorridos', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('fotos'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = DB.transaction(store, mode); const st = t.objectStore(store);
    let out; const q = fn(st); if (q) q.onsuccess = () => { out = q.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k));
const fotoGet = id => tx('fotos', 'readonly', s => s.get(id));
const fotoSet = (id, v) => tx('fotos', 'readwrite', s => s.put(v, id));
const fotoDel = id => tx('fotos', 'readwrite', s => s.delete(id));

let E = {edificios: [], tam: 2560, recientes: [], camara: 'app', camId: ''};   // estado
let guardando = Promise.resolve();
function guardar(){ const copia = JSON.parse(JSON.stringify(E)); guardando = guardando.then(() => kvSet('estado', copia)).catch(e => toast('No se pudo guardar: ' + e.message)); return guardando; }

/* ---------- búsqueda ---------- */
function buscarRuta(rid){ for (const ed of E.edificios) for (const r of ed.recorridos) if (r.id === rid) return {ed, r}; return null; }
const edif = id => E.edificios.find(e => e.id === id);
const fotosDe = r => r.estaciones.reduce((n, s) => n + s.fotos.length, 0);
function nombreRuta(r){
  const con = r.estaciones.filter(s => s.fotos.length);
  if (!con.length) return 'Sin fotos aún';
  const a = con[0].nombre || 'E01', b = con[con.length - 1].nombre || ('E' + pad(con.length, 2));
  return con.length > 1 && a !== b ? `${a} → ${b}` : a;
}

/* ---------- miniaturas ---------- */
const URLS = {};
async function thumbURL(id){
  if (URLS[id]) return URLS[id];
  const f = await fotoGet(id); if (!f) return '';
  URLS[id] = URL.createObjectURL(f.thumb || f.blob); return URLS[id];
}
function pintarMiniaturas(){
  document.querySelectorAll('img[data-f]').forEach(async im => { const u = await thumbURL(im.dataset.f); if (u) im.src = u; });
}

/* ---------- interfaz básica ---------- */
let tt;
function toast(m, ms = 2400){ let t = $('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = m; t.style.opacity = 1; clearTimeout(tt); tt = setTimeout(() => t.style.opacity = 0, ms); }
function ocupado(msg){ const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = `<div class="spin"></div><div class="msg">${esc(msg)}</div>`; document.body.appendChild(b);
  return {set: m => b.querySelector('.msg').textContent = m, fin: () => b.remove()}; }
function hoja(html, onOpen){
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = `<div class="sheet">${html}</div>`; document.body.appendChild(ov);
    const cerrar = v => { ov.remove(); res(v); };
    ov.addEventListener('click', e => { if (e.target === ov) cerrar(null); const b = e.target.closest('[data-r]'); if (b) cerrar(b.dataset.r); });
    if (onOpen) onOpen(ov.querySelector('.sheet'), cerrar);
  });
}
async function pedirTexto(titulo, valor = '', ayuda = ''){
  let inp;
  const r = await hoja(`<h3>${esc(titulo)}</h3>${ayuda ? `<p class="mute small">${esc(ayuda)}</p>` : ''}<input type="text" id="tx" value="${esc(valor)}" autocomplete="off">
    <div class="btns"><button data-r="no">Cancelar</button><button class="pri" data-r="ok">Listo</button></div>`,
    (sh, cerrar) => { inp = sh.querySelector('#tx'); setTimeout(() => { inp.focus(); inp.select(); }, 50);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') cerrar('ok'); }); });
  return r === 'ok' ? inp.value.trim() : null;
}
async function confirmar(titulo, texto, si = 'Borrar'){
  return (await hoja(`<h3>${esc(titulo)}</h3><p class="mute">${texto}</p><div class="btns"><button data-r="no">Cancelar</button><button class="pri" data-r="si">${esc(si)}</button></div>`)) === 'si';
}

/* ---------- navegación ---------- */
function ir(h){ if (location.hash !== h) location.hash = h; else render(); }
window.addEventListener('hashchange', render);
let activa = {};   // recorrido id -> estación activa

function render(){
  const h = location.hash.slice(1).split('/');
  if (h[0] === 'e' && edif(h[1])) return vistaEdificio(edif(h[1]));
  if (h[0] === 'r' && buscarRuta(h[1])) return vistaRecorrido(buscarRuta(h[1]));
  vistaInicio();
}

/* ---------- inicio ---------- */
function vistaInicio(){
  $('#hd').innerHTML = `<span class="dot"></span><h1>Captura de recorridos</h1><button class="ghost" id="bAyuda">?</button><button class="ghost" id="bAjustes">⚙</button>`;
  $('#dock').innerHTML = `<div class="acts" style="grid-template-columns:1fr"><button class="pri" id="bNuevoEd">＋ Edificio nuevo</button></div>`;
  const lista = E.edificios.slice().sort((a, b) => b.mod - a.mod);
  $('#main').innerHTML = lista.length ? `<div class="list">${lista.map(ed => {
      const nf = ed.recorridos.reduce((n, r) => n + fotosDe(r), 0);
      const tapa = ed.recorridos.flatMap(r => r.estaciones.flatMap(s => s.fotos))[0];
      return `<div class="card" data-ed="${ed.id}">${tapa ? `<img class="cover" data-f="${tapa}">` : '<div class="cover"></div>'}
        <div class="tx"><b>${esc(ed.nombre)}</b><span class="mute small">${ed.recorridos.length} recorrido${ed.recorridos.length === 1 ? '' : 's'} · ${nf} foto${nf === 1 ? '' : 's'}</span></div><span class="mute">›</span></div>`;
    }).join('')}</div>`
    : `<div class="empty"><b>Levanta un edificio por recorridos</b>Crea el edificio, después un recorrido por cada emergencia que quieras simular (por ejemplo: entrar por el acceso principal y subir al piso 2; entrar por el lado B y subir al techo).<br><br>Cada recorrido se exporta como un .zip que el Planificador abre con <i>Menú › Abrir proyecto</i>.</div>`;
  $('#main').querySelectorAll('[data-ed]').forEach(c => c.onclick = () => ir('#e/' + c.dataset.ed));
  $('#bNuevoEd').onclick = async () => {
    const n = await pedirTexto('Nombre del edificio', '', 'Ej: Entretecho Herrera 650');
    if (!n) return;
    const ed = {id: uid(), nombre: n, recorridos: [], mod: Date.now()};
    E.edificios.push(ed); await guardar(); ir('#e/' + ed.id);
  };
  $('#bAjustes').onclick = ajustes; $('#bAyuda').onclick = ayuda;
  pintarMiniaturas();
}

/* ---------- edificio ---------- */
function vistaEdificio(ed){
  $('#hd').innerHTML = `<button class="ghost" id="bAtras">‹</button><h1>${esc(ed.nombre)}</h1><button class="ghost" id="bMenu">⋯</button>`;
  $('#dock').innerHTML = `<div class="acts" style="grid-template-columns:1fr 1fr"><button id="bExpTodo" ${ed.recorridos.some(r => fotosDe(r)) ? '' : 'disabled'}>Exportar todos</button><button class="pri" id="bNuevoR">＋ Recorrido</button></div>`;
  $('#main').innerHTML = ed.recorridos.length ? `<div class="list">${ed.recorridos.map(r => {
      const nf = fotosDe(r); const tapa = r.estaciones.flatMap(s => s.fotos)[0];
      return `<div class="card" data-r="${r.id}">${tapa ? `<img class="cover" data-f="${tapa}">` : '<div class="cover"></div>'}
        <div class="tx"><b>R${r.n} · ${esc(r.nota || nombreRuta(r))}</b><span class="mute small">${(k => k + (k === 1 ? ' estación' : ' estaciones'))(r.estaciones.filter(s => s.fotos.length).length)} · ${nf} foto${nf === 1 ? '' : 's'}${r.nota ? ' · ' + esc(nombreRuta(r)) : ''}</span></div><span class="mute">›</span></div>`;
    }).join('')}</div>`
    : `<div class="empty"><b>Sin recorridos</b>Un recorrido es un camino por el edificio: desde donde entra la dotación hasta el foco. Puedes hacer varios del mismo edificio.</div>`;
  $('#main').querySelectorAll('[data-r]').forEach(c => c.onclick = () => ir('#r/' + c.dataset.r));
  $('#bAtras').onclick = () => ir('#');
  $('#bNuevoR').onclick = async () => {
    const n = ed.recorridos.reduce((m, r) => Math.max(m, r.n), 0) + 1;
    const r = {id: uid(), n, nota: '', estaciones: [{id: uid(), nombre: '', foco: false, fotos: []}], mod: Date.now()};
    ed.recorridos.push(r); ed.mod = Date.now(); await guardar(); ir('#r/' + r.id);
  };
  $('#bExpTodo').onclick = () => exportar(ed, ed.recorridos.filter(r => fotosDe(r)));
  $('#bMenu').onclick = async () => {
    const r = await hoja(`<h3>${esc(ed.nombre)}</h3><div class="stack"><button data-r="ren">Cambiar nombre</button><button class="danger" data-r="del">Borrar edificio y sus fotos</button></div><div class="btns"><button data-r="no">Cerrar</button></div>`);
    if (r === 'ren'){ const n = await pedirTexto('Nombre del edificio', ed.nombre); if (n){ ed.nombre = n; await guardar(); render(); } }
    if (r === 'del' && await confirmar('¿Borrar el edificio?', `Se borran <b>${ed.recorridos.length}</b> recorridos y sus fotos de este teléfono. Lo que ya exportaste no se toca.`)){
      for (const rr of ed.recorridos) for (const s of rr.estaciones) for (const f of s.fotos) await fotoDel(f);
      E.edificios = E.edificios.filter(x => x !== ed); await guardar(); ir('#');
    }
  };
  pintarMiniaturas();
}

/* ---------- recorrido (captura) ---------- */
function estActiva(r){
  let id = activa[r.id]; let s = r.estaciones.find(x => x.id === id);
  if (!s){ s = r.estaciones[r.estaciones.length - 1]; activa[r.id] = s.id; }
  return s;
}
function chipsPara(r, s){
  // sugerencias: los nombres propios usados primero, luego la lista partiendo después del nombre anterior
  const i = r.estaciones.indexOf(s); const prev = i > 0 ? r.estaciones[i - 1].nombre : '';
  const k = NOMBRES.indexOf(prev);
  const rot = k >= 0 ? NOMBRES.slice(k + 1).concat(NOMBRES.slice(0, k + 1)) : NOMBRES;
  const out = []; for (const n of [s.nombre, ...rot.slice(0, 3), ...E.recientes, ...rot.slice(3)]) if (n && !out.includes(n)) out.push(n);
  return out;
}
function vistaRecorrido({ed, r}){
  const s = estActiva(r);
  $('#hd').innerHTML = `<button class="ghost" id="bAtras">‹</button><h1>R${r.n} · ${esc(ed.nombre)}</h1><button class="pri" id="bExp" ${fotosDe(r) ? '' : 'disabled'}>Exportar</button><button class="ghost" id="bMenu">⋯</button>`;
  const vis = r.estaciones;
  let num = 0;
  $('#main').innerHTML = vis.map((x, i) => {
    num++;
    return `<div class="est ${x.id === s.id ? 'on' : ''}" data-s="${x.id}">
      <div class="hd"><span class="n">E${pad(num, 2)}</span><span class="nm ${x.nombre ? '' : 'sin'}" data-ren="${x.id}">${esc(x.nombre || 'sin nombre — toca para nombrar')}</span>
        <span class="mute small">${x.fotos.length}</span><button class="fx ${x.foco ? 'on' : ''}" data-foco="${x.id}" title="Foco del fuego">🔥</button><button class="ghost" data-smenu="${x.id}">⋯</button></div>
      ${x.fotos.length ? `<div class="strip">${x.fotos.map(f => `<img data-f="${f}" data-ver="${f}" data-en="${x.id}">`).join('')}</div>`
        : x.id === s.id ? '<div class="mute small" style="padding:0 12px 12px">Sin fotos: usa 📷 Foto o 🖼 Galería</div>' : ''}
    </div>`;
  }).join('') + `<p class="mute small" style="text-align:center">Toca una estación para seguir agregando fotos ahí.</p>`;
  const chips = chipsPara(r, s);
  $('#dock').innerHTML = `<div class="lbl">Nombre de <b>E${pad(vis.indexOf(s) + 1, 2)}</b>:</div>
    <div class="chips">${chips.map(n => `<button class="chip ${n === s.nombre ? 'on' : ''}" data-chip="${esc(n)}">${esc(n)}</button>`).join('')}<button class="chip" data-chip="__otro">✏️ Otro…</button></div>
    <div class="acts"><button id="bGal">🖼 Galería</button><button class="pri shot" id="bCam">📷 Foto</button><button id="bSig">Estación ›</button></div>`;
  // eventos
  $('#bAtras').onclick = () => ir('#e/' + ed.id);
  $('#bExp').onclick = () => exportar(ed, [r]);
  $('#main').querySelectorAll('.est').forEach(c => c.addEventListener('click', e => {
    if (e.target.closest('button,[data-ren],[data-ver]')) return;
    activa[r.id] = c.dataset.s; render();

async function decodificar(file, opt){
  try { return await createImageBitmap(file, {imageOrientation: 'from-image', ...opt}); }
  catch (e) { // navegadores sin opciones de createImageBitmap
    const u = URL.createObjectURL(file); const im = new Image(); im.src = u; await im.decode(); URL.revokeObjectURL(u); return im;
  }
}
function aBlob(img, w, h, q){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('sin memoria')), 'image/jpeg', q));
}
// medidas de un JPEG leyendo solo su encabezado (sin decodificar la foto entera)
async function medidasJPEG(file){
  try {
    const u = new Uint8Array(await file.slice(0, 512 * 1024).arrayBuffer());
    if (u[0] !== 0xFF || u[1] !== 0xD8) return null;
    let i = 2;
    while (i + 9 < u.length){
      if (u[i] !== 0xFF){ i++; continue; }
      const m = u[i + 1];
      if (m === 0xFF){ i++; continue; }
      if (m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)){ i += 2; continue; }
      if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) return {h: (u[i + 5] << 8) | u[i + 6], w: (u[i + 7] << 8) | u[i + 8]};
      i += 2 + ((u[i + 2] << 8) | u[i + 3]);
    }
  } catch (e) {}
  return null;
}
async function procesar(file){
  const max = +E.tam;
  // miniatura (y proporción) decodificando en chico, para no llenar la memoria del teléfono
  let mini = await decodificar(file, {resizeWidth: 320, resizeQuality: 'medium'});
  let mw = mini.width, mh = mini.height;
  const thumb = await aBlob(mini, 320, Math.round(320 * mh / mw), .72);
  mini.close?.();
  // si ya es chica (o se pidió el original), se guarda tal cual: sin recomprimir
  const dim = await medidasJPEG(file);
  const lado = dim ? Math.max(dim.w, dim.h) : 0, corto = dim ? Math.min(dim.w, dim.h) : 0;
  if (dim && (!max || lado <= max)) return {blob: file, thumb, w: mw >= mh ? lado : corto, h: mw >= mh ? corto : lado};
  if (!max) return {blob: file, thumb, w: 4000, h: Math.round(4000 * mh / mw)};
  const apaisada = mw >= mh;
  const big = await decodificar(file, apaisada ? {resizeWidth: max, resizeQuality: 'high'} : {resizeHeight: max, resizeQuality: 'high'});
  let w = big.width, h = big.height;
  if (Math.max(w, h) > max){ const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
  const blob = await aBlob(big, w, h, .9);
  big.close?.();
  return {blob, thumb, w, h};
}
async function agregar(files){
  if (!files.length) return;
  if (!destino){ const h = location.hash.slice(1).split('/'); if (h[0] === 'r') destino = {rid: h[1], sid: null}; else return; }
  const br = buscarRuta(destino.rid); if (!br) return;
  const st = br.r.estaciones.find(x => x.id === destino.sid) || estActiva(br.r);
  const b = files.length > 1 ? ocupado('Guardando fotos…') : null;
  let ok = 0;
  for (const f of files){
    b?.set(`Guardando ${ok + 1} de ${files.length}…`);
    try {
      const p = await procesar(f); const id = uid();
      await fotoSet(id, {blob: p.blob, thumb: p.thumb, w: p.w, h: p.h, orig: f.name, t: Date.now()});
      st.fotos.push(id); ok++;
      await guardar();
    } catch (e) { toast('No pude leer ' + f.name); }
  }
  br.r.mod = br.ed.mod = Date.now(); await guardar();
  b?.fin();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  render();
  toast(ok === 1 ? 'Foto guardada' : `${ok} fotos guardadas`);

/* ---------- exportar (mismo formato que el .zip del planificador) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++){ let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; } return t; })();
function crc32(u){ let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files){
  const enc = new TextEncoder(); const parts = []; const cd = []; let off = 0;
  for (const f of files){ const name = enc.encode(f.name), d = f.data, crc = crc32(d);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, d);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    cd.push(c.buffer, name); off += 30 + name.length + d.length; }
  const cdSize = cd.reduce((s, p) => s + (p.byteLength ?? p.length), 0);
  const e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cd, e.buffer], {type: 'application/zip'});
}
async function zipRecorrido(ed, r, avance){
  const enc = new TextEncoder();
  const ests = r.estaciones.filter(s => s.fotos.length);
  const nodes = [], arrows = [], files = [], indice = ['diapositiva,nombre,estacion,original'];
  let num = 0, prev = null, start = null;
  const total = fotosDe(r);
  for (let i = 0; i < ests.length; i++){
    const s = ests[i]; let focoPuesto = false;
    for (let k = 0; k < s.fotos.length; k++){
      const f = await fotoGet(s.fotos[k]); if (!f) continue;
      num++; avance?.(num, total);
      let nom = 'E' + pad(i + 1, 2) + (s.nombre ? ' ' + s.nombre : '');
      if (k > 0) nom += ` (${k + 1})`;
      const file = `${pad(num)}_${slug(nom)}.jpg`;
      const id = uid();
      const final = s.foco && !focoPuesto; if (final) focoPuesto = true;
      nodes.push({id, num, name: nom, file, w: f.w, h: f.h, vacant: false, final});
      if (prev){ arrows.push({id: uid(), from: prev, to: id, type: 'up', x: .5, y: .55, scale: 1});
                 arrows.push({id: uid(), from: id, to: prev, type: 'down', x: .5, y: .86, scale: 1}); }
      prev = id; if (!start) start = id;
      files.push({name: 'fotos/' + file, data: new Uint8Array(await f.blob.arrayBuffer())});
      indice.push(`${pad(num)},"${nom.replace(/"/g, "'")}",${i + 1},"${(f.orig || '').replace(/"/g, "'")}"`);
    }
  }
  const a = ests[0]?.nombre || 'E01', b = ests[ests.length - 1]?.nombre || ('E' + pad(ests.length, 2));
  const tramo = ests.length > 1 && a !== b ? `${a} → ${b}` : a;
  const nombre = `${ed.nombre} · R${r.n} · ${r.nota || tramo}`;
  const S = {v: 1, pid: uid(), name: nombre, nextNum: num + 1, startId: start, nodes, arrows, effects: [], applied: null, exportWidth: 1920};
  files.unshift({name: 'proyecto_recorrido.json', data: enc.encode(JSON.stringify({app: 'planificador-recorridos-fs', S, thumbs: {}}))});
  files.push({name: 'indice.csv', data: enc.encode('﻿' + indice.join('\r\n'))});
  const fname = `${slug(ed.nombre)}_R${r.n}_${slug(r.nota || tramo.replace('→', 'a'))}.zip`;
  return new File([zip(files)], fname, {type: 'application/zip'});
}
function descargar(file){
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);

async function exportar(ed, rutas){
  if (!rutas.length) return;

  try {

  } catch (e) { b.fin(); toast('No se pudo exportar: ' + e.message, 4000); return; }
  b.fin();

    <div class="btns">${puedeCompartir ? '<button class="pri" data-r="share">Compartir…</button>' : ''}<button ${puedeCompartir ? '' : 'class="pri"'} data-r="dl">Descargar</button><button data-r="no">Cerrar</button></div>`);
  if (v === 'share'){

    catch (e) { if (e.name !== 'AbortError'){ toast('No se pudo compartir; lo descargo'); out.forEach(descargar); } }

/* ---------- cámara dentro de la app (no sale del navegador: sin cierres por memoria) ---------- */
let CAM = null;
function camParar(){ if (CAM?.stream) CAM.stream.getTracks().forEach(t => t.stop()); if (CAM) CAM.stream = null; }
async function camLentes(){
  const ds = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const tras = ds.filter(d => /back|rear|tras|environment|posterior/i.test(d.label));
  return tras.length ? tras : ds;
}
async function camIniciar(devId){
  camParar();
  const v = CAM.el.querySelector('video'), msg = CAM.el.querySelector('.cmsg');
  msg.textContent = 'Abriendo cámara…'; msg.hidden = false;
  const fuente = devId ? {deviceId: {exact: devId}} : {facingMode: {ideal: 'environment'}};
  let stream = null;
  for (const extra of [{width: {ideal: 1920}, height: {ideal: 1440}, zoom: true}, {width: {ideal: 1920}, height: {ideal: 1440}}, {}]){
    try { stream = await navigator.mediaDevices.getUserMedia({video: {...fuente, ...extra}, audio: false}); break; } catch (e) { CAM.err = e; }
  }
  if (!stream && devId) return camIniciar(null);   // el lente guardado ya no existe
  if (!stream){
    msg.innerHTML = `No pude abrir la cámara (${esc(CAM.err?.name || 'error')}).<br>Revisa el permiso de cámara del navegador, o usa 🖼 Galería.`;
    return;
  }
  if (!CAM.el.isConnected){ stream.getTracks().forEach(t => t.stop()); return; }
  CAM.stream = stream; CAM.track = stream.getVideoTracks()[0];
  v.srcObject = stream; try { await v.play(); } catch (e) {}
  msg.hidden = true;
  const set = CAM.track.getSettings ? CAM.track.getSettings() : {};
  if (set.deviceId){ CAM.devId = set.deviceId; E.camId = set.deviceId; guardar(); }
  CAM.lentes = await camLentes();
  const i = CAM.lentes.findIndex(d => d.deviceId === CAM.devId);
  CAM.el.querySelector('[data-c=sw]').textContent = CAM.lentes.length > 1 ? `⇄ Lente ${i + 1}/${CAM.lentes.length}` : '⇄ Lente';
  CAM.el.querySelector('[data-c=sw]').disabled = CAM.lentes.length < 2;
  camZoom();
}
function camZoom(){
  const box = CAM.el.querySelector('.czoom'); box.innerHTML = '';
  const cap = CAM.track?.getCapabilities ? CAM.track.getCapabilities() : {};
  const z = cap.zoom; if (!z || !(z.max > z.min)) return;
  const actual = CAM.track.getSettings().zoom ?? 1;
  const vals = [...new Set([z.min, 1, 2, 4].filter(x => x >= z.min && x <= z.max).map(x => Math.round(x * 10) / 10))];
  box.innerHTML = vals.map(x => `<button data-z="${x}" class="${Math.abs(x - actual) < .05 ? 'on' : ''}">${x}×</button>`).join('');
  box.querySelectorAll('[data-z]').forEach(b => b.onclick = async () => {
    try { await CAM.track.applyConstraints({advanced: [{zoom: +b.dataset.z}]}); camZoom(); } catch (e) { toast('Este lente no acepta ese zoom'); }
  });
}
async function camFoto(){
  const v = CAM.el.querySelector('video');
  let blob = null;
  if ('ImageCapture' in window && CAM.track){
    try {
      const ic = new ImageCapture(CAM.track); let opt = {};
      try { const pc = await ic.getPhotoCapabilities(); const W = pc.imageWidth;
        if (W && W.max){ const quiero = +E.tam ? Math.min(W.max, Math.max(W.min || 0, +E.tam)) : W.max; opt = {imageWidth: quiero}; } } catch (e) {}
      blob = await ic.takePhoto(opt);
    } catch (e) { blob = null; }
  }
  if (!blob && v.videoWidth){   // respaldo: el cuadro del video
    const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .92));
  }
  return blob;
}
function abrirCamara(rid, sid){
  const br = buscarRuta(rid); const st = br.r.estaciones.find(x => x.id === sid);
  const el = document.createElement('div'); el.className = 'cam';
  el.innerHTML = `<video playsinline muted autoplay></video>
    <div class="ctop"><span><span class="cn">E${pad(br.r.estaciones.indexOf(st) + 1, 2)}</span> ${esc(st.nombre || 'sin nombre')}</span><span class="cnt">${st.fotos.length} foto${st.fotos.length === 1 ? '' : 's'}</span></div>
    <div class="cmsg"></div><img class="cprev"><div class="czoom"></div>
    <div class="cbar"><button data-c="x">Listo</button><button class="shut" data-c="shot" aria-label="Tomar foto"></button><button data-c="sw">⇄ Lente</button></div>`;
  document.body.appendChild(el);
  CAM = {el, rid, sid, devId: E.camId};
  el.querySelector('.cbar').onclick = async e => {
    const c = e.target.closest('[data-c]')?.dataset.c; if (!c) return;
    if (c === 'x'){ camParar(); el.remove(); CAM = null; render(); return; }
    if (c === 'sw' && CAM.lentes?.length > 1){
      const i = CAM.lentes.findIndex(d => d.deviceId === CAM.devId);
      await camIniciar(CAM.lentes[(i + 1) % CAM.lentes.length].deviceId); return;
    }
    if (c === 'shot'){
      const b = el.querySelector('.shut'); if (b.disabled || !CAM.stream) return; b.disabled = true;
      el.querySelector('video').style.opacity = .3; setTimeout(() => el.querySelector('video').style.opacity = 1, 120);
      try {
        const blob = await camFoto(); if (!blob) throw new Error('sin imagen');
        const f = new File([blob], `CAM_${new Date().toISOString().replace(/\D/g, '').slice(0, 14)}.jpg`, {type: 'image/jpeg'});
        destino = {rid, sid}; await agregar([f]);
        const pv = el.querySelector('.cprev'); if (pv.src) URL.revokeObjectURL(pv.src); pv.src = URL.createObjectURL(blob); pv.style.display = 'block';
        const n = st.fotos.length; el.querySelector('.cnt').textContent = `${n} foto${n === 1 ? '' : 's'}`;
      } catch (err) { toast('No se pudo tomar la foto: ' + err.message); }
      b.disabled = false;
    }
  };
  camIniciar(CAM.devId || null);
}
document.addEventListener('visibilitychange', () => {
  if (!CAM) return;
  if (document.hidden) camParar(); else if (!CAM.stream) camIniciar(CAM.devId || null);
});
